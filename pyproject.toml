[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edittextinimage"
version = "0.1.0"
description = "Reference package for EditTextInImage — freemium online tool to replace text in images while keeping font, color, and background."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "leony", email = "leony2919@gmail.com" }]
keywords = ["edit-text-in-image", "image-editing", "ai", "ocr", "poster", "screenshot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
[project.urls]
Homepage = "https://edittextinimage.com/"
Documentation = "https://edittextinimage.com/"
Source = "https://github.com/wayperlee/edittextinimage"
Support = "mailto:support@edittextinimage.com"

[tool.setuptools.packages.find]
where = ["src"]
